task: oab_exams_cloze
dataset_path: nicholasKluge/oab_exams
test_split: train
process_docs: !function util.process_test_docs
fewshot_split: train
fewshot_config:
  sampler: default
  process_docs: !function util.process_fewshot_docs
num_fewshot: 3
description: "As perguntas a seguir são questões de múltipla escolha do Exame de Ordem da\
  \ Ordem dos Advogados do Brasil (OAB), selecione a única alternativa correta e\
  \ responda apenas com as letras \"A\", \"B\", \"C\" ou \"D\".\n\n"
output_type: multiple_choice
doc_to_text: !function util.doc_to_text
doc_to_target: answerKey
doc_to_choice: !function util.doc_to_choice
should_decontaminate: true
doc_to_decontamination_query: !function util.doc_to_text
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0

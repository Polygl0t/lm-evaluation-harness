task: germanquad
tag:
  - german_native
dataset_path: deepset/germanquad
dataset_kwargs:
  # The dataset's loading script is no longer supported by `datasets`; load the
  # auto-converted parquet files instead.
  revision: refs/convert/parquet
output_type: generate_until
training_split: train
test_split: test
fewshot_split: train
doc_to_text: "Kontext: {{context}}\n\nFrage: {{question}}\n\nAntwort:"
doc_to_target: "{{answers['text'][0] | trim}}"
process_results: !function utils.process_results_germanquad
generation_kwargs:
  until:
    - "\n"
    - "Frage:"
    - "Kontext:"
  max_gen_toks: 64
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
num_fewshot: 3
metadata:
  version: 1.0

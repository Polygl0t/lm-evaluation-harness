task: bluex_generative
dataset_path: nicholasKluge/BLUEX_without_images # filter of portuguese-benchmark-datasets/BLUEX
test_split: train
process_docs: !function utils.process_test_docs
fewshot_split: train
fewshot_config:
  sampler: first_n
  process_docs: !function utils.process_fewshot_docs
num_fewshot: 3
description: "As perguntas a seguir são questões de múltipla escolha de provas\
  \ de vestibular de universidades brasileiras, selecione a única alternativa\
  \ correta e responda apenas com a letra correspondente.\n\n"
output_type: generate_until
# Same prompt as the `bluex` (multiple_choice) task: it already ends in "Resposta
# correta:", so the model's continuation should start with the answer letter.
doc_to_text: !function utils.doc_to_text
doc_to_target: answerKey
should_decontaminate: true
doc_to_decontamination_query: !function utils.doc_to_text
generation_kwargs:
  until:
    - "Pergunta:"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 256
filter_list:
  - name: strict-match
    filter:
      - function: regex
        regex_pattern: '^\s*[\*"(\[]*\(?([A-E])\)?[\*"\]]*[ \t]*(?=[.:;,\-)\n]|$)'
      - function: take_first
  - name: flexible-extract
    filter:
      - function: regex
        regex_pattern: '(?i)(?:letra|alternativa|op[çc][ãa]o|resposta(?:\s+correta)?)\s*(?:[ée]|:|=)?\s*[\*"(\[]*\(?([A-E])\)?(?!\w)'
        group_select: -1
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
